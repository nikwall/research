<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="516 algorithms, no sure winner: the algorithm expected to win ends up mid-table, and the actual winner was not the favourite. Schematic." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">516 algorithms.</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">No sure winner.</text>
  <text x="48" y="234" font-size="19" font-weight="300" fill="#2f3639">129 teams pooled the same forecasts</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">by 1,182 people. Their makers were</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">overconfident about which would win.</text>
  <text x="48" y="352" font-size="15" font-weight="300" fill="#5b6366">Schematic, not data.</text>
  <g font-size="15" font-weight="500" fill="#5b6366" letter-spacing="1.5" text-anchor="middle">
    <text x="560" y="80">EXPECTED RANK</text>
    <text x="860" y="80">ACTUAL RANK</text>
  </g>
  <text x="542" y="117" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">1</text><text x="878" y="117" font-size="14" font-weight="400" fill="#5b6366">1</text><text x="542" y="143" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">2</text><text x="878" y="143" font-size="14" font-weight="400" fill="#5b6366">2</text><text x="542" y="169" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">3</text><text x="878" y="169" font-size="14" font-weight="400" fill="#5b6366">3</text><text x="542" y="195" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">4</text><text x="878" y="195" font-size="14" font-weight="400" fill="#5b6366">4</text><text x="542" y="221" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">5</text><text x="878" y="221" font-size="14" font-weight="400" fill="#5b6366">5</text><text x="542" y="247" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">6</text><text x="878" y="247" font-size="14" font-weight="400" fill="#5b6366">6</text><text x="542" y="273" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">7</text><text x="878" y="273" font-size="14" font-weight="400" fill="#5b6366">7</text><text x="542" y="299" font-size="14" font-weight="400" fill="#5b6366" text-anchor="end">8</text><text x="878" y="299" font-size="14" font-weight="400" fill="#5b6366">8</text>
