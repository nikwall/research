<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="Online experiments, face to face: chaTree adds live video chat to oTree and records who talks when." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
