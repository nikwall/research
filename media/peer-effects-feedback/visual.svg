<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="One benchmark does not fit all: men perform better when compared with the best peer, women when compared with the average. Schematic." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <symbol id="pef-person" viewBox="-16 -36 32 58"><circle cx="0" cy="-24" r="10"/><path d="M-15 21 v-15 a15 15 0 0 1 30 0 v15 z"/></symbol>
  </defs>
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">One benchmark</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">does not fit all.</text>
  <text x="48" y="234" font-size="19" font-weight="300" fill="#2f3639">In a lab experiment, men perform better</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">when compared with the best peer,</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">women when compared with the average.</text>

  <text x="720" y="76" font-size="15" font-weight="500" fill="#5b6366" letter-spacing="1.5" text-anchor="middle">PERFORMANCE WHEN COMPARED WITH</text>

  <!-- Men: the best peer spurs them more -->
  <use href="#pef-person" x="502" y="104" width="36" height="66" fill="#135b49"/>
  <text x="548" y="150" font-size="22" font-weight="400" fill="#2f3639">men</text>
  <rect x="512" y="186" width="80" height="112" rx="4" fill="#135b49"/>
  <rect x="604" y="246" width="80" height="52" rx="4" fill="#9dc09f"/>
  <line x1="500" y1="298" x2="696" y2="298" stroke="#5b6366" stroke-width="1.5"/>
  <text x="552" y="322" font-size="16" font-weight="400" fill="#2f3639" text-anchor="middle">the best</text>
  <text x="644" y="322" font-size="16" font-weight="300" fill="#5b6366" text-anchor="middle">the average</text>

  <!-- Women: the average spurs them more -->
  <use href="#pef-person" x="756" y="104" width="36" height="66" fill="#135b49"/>
  <text x="802" y="150" font-size="22" font-weight="400" fill="#2f3639">women</text>
  <rect x="766" y="246" width="80" height="52" rx="4" fill="#9dc09f"/>
  <rect x="858" y="186" width="80" height="112" rx="4" fill="#135b49"/>
  <line x1="754" y1="298" x2="950" y2="298" stroke="#5b6366" stroke-width="1.5"/>
  <text x="806" y="322" font-size="16" font-weight="300" fill="#5b6366" text-anchor="middle">the best</text>
  <text x="898" y="322" font-size="16" font-weight="400" fill="#2f3639" text-anchor="middle">the average</text>

  <text x="500" y="362" font-size="15" font-weight="300" fill="#5b6366">Bars: performance within each group, schematic.</text>
</svg>
