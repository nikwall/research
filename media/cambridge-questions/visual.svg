<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="Many perspectives, one future map: several lists merge into one set of questions, and what several people name leads the set and spans a future map." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="130" font-size="46" font-weight="300" fill="#135b49">Many perspectives,</text>
  <text x="48" y="184" font-size="46" font-weight="300" fill="#135b49">one future map.</text>
  <text x="48" y="233" font-size="19" font-weight="300" fill="#2f3639">I will ask scholars at Harvard and MIT for</text>
  <text x="48" y="260" font-size="19" font-weight="300" fill="#2f3639">their questions about the future of the</text>
  <text x="48" y="287" font-size="19" font-weight="300" fill="#2f3639">economy and of economics. In preparation.</text>

