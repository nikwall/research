<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="It's the position, not the task: where time limits the work, AI lets fewer people do it; where someone must be accountable, the position stays and its holder delegates more." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <symbol id="pnt-person" viewBox="-16 -36 32 58"><circle cx="0" cy="-24" r="10"/><path d="M-15 21 v-15 a15 15 0 0 1 30 0 v15 z"/></symbol>
  </defs>
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">It's the position,</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">not the task.</text>
  <text x="48" y="234" font-size="19" font-weight="300" fill="#2f3639">AI cuts jobs where time is the limit,</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">not where someone has to answer</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">for the result.</text>

  <g font-size="15" font-weight="500" fill="#5b6366" letter-spacing="1.5">
    <text x="470" y="74">TIME-CONSTRAINED</text>
    <text x="470" y="226">ACCOUNTABILITY-CONSTRAINED</text>
  </g>

  <!-- Time-constrained: five people do the work, AI lets three do it -->
  <g fill="#135b49">
    <use href="#pnt-person" x="470" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="504" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="538" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="572" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="606" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="744" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="778" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="812" y="88" width="30" height="56"/>
  </g>
  <g fill="none" stroke="#bb2649" stroke-width="2" stroke-dasharray="4 3">
    <use href="#pnt-person" x="846" y="88" width="30" height="56"/>
    <use href="#pnt-person" x="880" y="88" width="30" height="56"/>
  </g>
  <path d="M654 118 h66 m-11 -9 l11 9 l-11 9" fill="none" stroke="#5b6366" stroke-width="2"/>
  <text x="687" y="106" font-size="17" font-weight="500" fill="#5b6366" text-anchor="middle">AI</text>
  <text x="744" y="172" font-size="17" font-weight="300" fill="#bb2649">fewer people</text>

  <!-- Accountability-constrained: one person stays, the tasks move to AI -->
  <use href="#pnt-person" x="470" y="240" width="30" height="56" fill="#135b49"/>
  <g fill="#135b49">
    <rect x="512" y="262" width="22" height="22" rx="3"/><rect x="540" y="262" width="22" height="22" rx="3"/>
    <rect x="568" y="262" width="22" height="22" rx="3"/><rect x="596" y="262" width="22" height="22" rx="3"/>
  </g>
  <path d="M654 270 h66 m-11 -9 l11 9 l-11 9" fill="none" stroke="#5b6366" stroke-width="2"/>
  <text x="687" y="258" font-size="17" font-weight="500" fill="#5b6366" text-anchor="middle">AI</text>
  <use href="#pnt-person" x="744" y="240" width="30" height="56" fill="#135b49"/>
  <g fill="#ffffff" stroke="#9dc09f" stroke-width="2">
    <rect x="786" y="262" width="22" height="22" rx="3"/><rect x="814" y="262" width="22" height="22" rx="3"/>
    <rect x="842" y="262" width="22" height="22" rx="3"/><rect x="870" y="262" width="22" height="22" rx="3"/>
  </g>
  <text x="744" y="324" font-size="17" font-weight="300" fill="#135b49">same person, delegating</text>
</svg>
