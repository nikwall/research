<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="Whistleblower protection has a hidden cost: it makes reports more likely, and managers and employees cooperate less. Schematic." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <symbol id="wbp-person" viewBox="-16 -36 32 58"><circle cx="0" cy="-24" r="10"/><path d="M-15 21 v-15 a15 15 0 0 1 30 0 v15 z"/></symbol>
    <symbol id="wbp-shield" viewBox="0 0 24 28"><path d="M12 1 L23 5 V13 C23 20 18 25 12 27 C6 25 1 20 1 13 V5 Z"/></symbol>
    <symbol id="wbp-report" viewBox="0 0 40 28"><rect x="1" y="1" width="38" height="26" rx="3"/><path d="M1 3 L20 16 L39 3" fill="none"/></symbol>
  </defs>
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">Whistleblower</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">protection has</text>
  <text x="48" y="212" font-size="46" font-weight="300" fill="#135b49">a hidden cost.</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">Protection makes reports more likely.</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">In a lab experiment, it also makes</text>
  <text x="48" y="315" font-size="19" font-weight="300" fill="#2f3639">managers and employees cooperate less.</text>
  <text x="48" y="352" font-size="15" font-weight="300" fill="#5b6366">Schematic, not data.</text>

  <g font-size="15" font-weight="500" fill="#5b6366" letter-spacing="1.5">
    <text x="470" y="74">WITHOUT PROTECTION</text>
    <text x="470" y="226">WITH PROTECTION</text>
  </g>

  <!-- Without protection: they cooperate, a report is unlikely -->
  <use href="#wbp-person" x="474" y="88" width="34" height="62" fill="#135b49"/>
  <rect x="514" y="113" width="122" height="10" rx="5" fill="#135b49"/>
  <use href="#wbp-person" x="642" y="88" width="34" height="62" fill="#135b49"/>
  <text x="575" y="104" font-size="16" font-weight="300" fill="#135b49" text-anchor="middle">cooperate</text>
  <path d="M694 118 h44 m-9 -7 l9 7 l-9 7" fill="none" stroke="#9dc09f" stroke-width="2" stroke-dasharray="4 3"/>
  <use href="#wbp-report" x="748" y="104" width="40" height="28" fill="none" stroke="#9dc09f" stroke-width="2"/>
  <text x="800" y="124" font-size="16" font-weight="300" fill="#5b6366">report less likely</text>
  <g font-size="14" font-weight="400" fill="#5b6366" text-anchor="middle">
    <text x="491" y="172">manager</text>
    <text x="659" y="172">employee</text>
  </g>

  <!-- With protection: reports become likelier, cooperation thins out -->
  <use href="#wbp-person" x="474" y="240" width="34" height="62" fill="#135b49"/>
  <line x1="518" y1="270" x2="632" y2="270" stroke="#bb2649" stroke-width="3" stroke-dasharray="7 6"/>
  <use href="#wbp-person" x="642" y="240" width="34" height="62" fill="#135b49"/>
  <use href="#wbp-shield" x="684" y="258" width="26" height="30" fill="#9dc09f" stroke="#135b49" stroke-width="1.5"/>
  <text x="575" y="256" font-size="16" font-weight="300" fill="#bb2649" text-anchor="middle">cooperate less</text>
  <path d="M716 270 h22 m-9 -7 l9 7 l-9 7" fill="none" stroke="#5b6366" stroke-width="2"/>
  <use href="#wbp-report" x="748" y="256" width="40" height="28" fill="#9dc09f" stroke="#135b49" stroke-width="2"/>
  <text x="800" y="276" font-size="16" font-weight="300" fill="#135b49">report more likely</text>
  <g font-size="14" font-weight="400" fill="#5b6366" text-anchor="middle">
    <text x="491" y="324">manager</text>
    <text x="659" y="324">employee</text>
  </g>
</svg>
