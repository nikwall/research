<svg xmlns="http://www.w3.org/2000/svg" class="vis" viewBox="0 0 1000 400" role="img" aria-label="One goal, three values: a goal at 0–0 adds 2 points, at 0–1 it adds 1 point, at 3–0 it adds nothing." font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="400" fill="#f1f5f0"/>
  <text x="48" y="104" font-size="46" font-weight="300" fill="#135b49">One goal,</text>
  <text x="48" y="158" font-size="46" font-weight="300" fill="#135b49">three values.</text>
  <text x="48" y="234" font-size="19" font-weight="300" fill="#2f3639">Statistics count every goal as one.</text>
  <text x="48" y="261" font-size="19" font-weight="300" fill="#2f3639">What it adds to the result</text>
  <text x="48" y="288" font-size="19" font-weight="300" fill="#2f3639">depends on the score.</text>
  <text x="48" y="352" font-size="15" font-weight="300" fill="#5b6366">Win 3 points, draw 1, loss 0.</text>

  <g font-size="15" font-weight="500" fill="#5b6366" letter-spacing="1.5">
    <text x="497" y="78" text-anchor="middle">SCORE BEFORE</text>
    <text x="667" y="78" text-anchor="middle">AFTER THE GOAL</text>
    <text x="800" y="78">POINTS ADDED</text>
  </g>

  <g font-size="30" font-weight="400" fill="#2f3639" text-anchor="middle">
    <!-- 0–0 to 1–0: draw becomes win -->
    <rect x="442" y="100" width="110" height="54" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="2"/>
    <text x="497" y="138">0 – 0</text>
    <path d="M562 127 h40 m-10 -8 l10 8 l-10 8" fill="none" stroke="#5b6366" stroke-width="2"/>
    <rect x="612" y="100" width="110" height="54" rx="8" fill="#ffffff" stroke="#135b49" stroke-width="2"/>
    <text x="667" y="138">1 – 0</text>

    <!-- 0–1 to 1–1: loss becomes draw -->
    <rect x="442" y="190" width="110" height="54" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="2"/>
    <text x="497" y="228">0 – 1</text>
    <path d="M562 217 h40 m-10 -8 l10 8 l-10 8" fill="none" stroke="#5b6366" stroke-width="2"/>
    <rect x="612" y="190" width="110" height="54" rx="8" fill="#ffffff" stroke="#135b49" stroke-width="2"/>
    <text x="667" y="228">1 – 1</text>

    <!-- 3–0 to 4–0: the win was already safe -->
    <rect x="442" y="280" width="110" height="54" rx="8" fill="#ffffff" stroke="#9dc09f" stroke-width="2"/>
    <text x="497" y="318">3 – 0</text>
    <path d="M562 307 h40 m-10 -8 l10 8 l-10 8" fill="none" stroke="#5b6366" stroke-width="2"/>
    <rect x="612" y="280" width="110" height="54" rx="8" fill="#ffffff" stroke="#135b49" stroke-width="2"/>
    <text x="667" y="318">4 – 0</text>
  </g>

  <rect x="800" y="108" width="116" height="38" rx="5" fill="#135b49"/>
  <text x="930" y="140" font-size="32" font-weight="400" fill="#135b49">+2</text>
  <rect x="800" y="198" width="58" height="38" rx="5" fill="#135b49"/>
  <text x="872" y="230" font-size="32" font-weight="400" fill="#135b49">+1</text>
  <line x1="801" y1="290" x2="801" y2="324" stroke="#bb2649" stroke-width="3"/>
  <text x="816" y="320" font-size="32" font-weight="400" fill="#bb2649">0</text>
</svg>
